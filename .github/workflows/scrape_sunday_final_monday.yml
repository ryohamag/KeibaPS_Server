name: Scrape - 日曜夜(祝日などの月曜開催分を確定)

on:
  schedule:
    - cron: "0 12 * * 0" # JST 日曜21:00
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Finalize Monday race cards (skipped when there are no races)
        env:
          GOOGLE_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_BASE64 }}
        run: python run_scrape.py --target monday --final --skip-if-no-races
