name: Scrape - 手動日付指定(動作確認・リカバリ用)

on:
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 (YYYYMMDD形式)"
        required: true
        type: string
      final:
        description: "final版として racedata/final/ にも保存する"
        required: false
        type: boolean
        default: true
      diff:
        description: "final版との差分チェックも行う"
        required: false
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Scrape specified date
        env:
          GOOGLE_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          ARGS="--date ${{ inputs.date }}"
          if [ "${{ inputs.final }}" = "true" ]; then ARGS="$ARGS --final"; fi
          if [ "${{ inputs.diff }}" = "true" ]; then ARGS="$ARGS --diff"; fi
          python run_scrape.py $ARGS
