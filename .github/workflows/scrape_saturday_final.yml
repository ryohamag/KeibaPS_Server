name: Scrape - 土曜夜(日曜分を確定)

on:
  schedule:
    - cron: "0 12 * * 6" # JST 土曜21:00
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Finalize Sunday race cards
        env:
          GOOGLE_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_BASE64 }}
        run: python run_scrape.py --target sunday --final
